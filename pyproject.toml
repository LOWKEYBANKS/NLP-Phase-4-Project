[project]
name = "sentiment-pipeline"
version = "0.1.0"
description = "Twitter sentiment analysis pipeline"
authors = [
  {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

# Core runtime requirements
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
visualization = [
  "matplotlib>=3.8",
  "wordcloud>=1.9",
  "nltk>=3.8",
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
sentiment-pipeline = "sentiment_pipeline.pipeline:main"